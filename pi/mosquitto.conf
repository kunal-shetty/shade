# CyberSentinel — Mosquitto broker for the rover LAN
#
# The mobile app speaks MQTT over WebSockets (listener 9001); CLI tools and the
# gateway use plain TCP MQTT (listener 1883).
#
# NOTE: anonymous access is enabled because this broker is meant to live on an
# isolated rover network. Add a password file before exposing it anywhere else.
#
# Persistence is NOT set here on purpose: the distro's main mosquitto.conf
# already defines `persistence true` and `persistence_location`, and repeating
# those directives can make the broker refuse to start.

allow_anonymous true

listener 1883
protocol mqtt

# --- websockets ---
# The app connects to this listener. pi/setup.sh deletes this whole block when
# the installed Mosquitto was compiled without WebSocket support.
listener 9001
protocol websockets
