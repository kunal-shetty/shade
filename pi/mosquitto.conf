# CyberSentinel — Mosquitto broker for the rover LAN
#
# The mobile app speaks MQTT over WebSockets (listener 9001); CLI tools and the
# gateway use plain TCP MQTT (listener 1883).
#
# NOTE: anonymous access is enabled because this broker is meant to live on an
# isolated rover network. Add a password file before exposing it anywhere else.

persistence true
persistence_location /var/lib/mosquitto/

listener 1883
protocol mqtt
allow_anonymous true

listener 9001
protocol websockets
allow_anonymous true
